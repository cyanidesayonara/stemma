# Take a GitHub release into Microsoft Store certification, in two runs, with
# the Microsoft Store CLI (msstore). See docs/store-release-pipeline.md.
# - update_draft stages the release's MSIX and the listing from
#   store/listing.yaml in a draft. Partner Center's own page keeps showing the
#   old package and listing ("Unchanged") until the draft is committed: the
#   Store only ingests a staged package at commit. Check the staged draft in
#   the run log and the submission-metadata artifact (get_draft prints it too).
# - submit commits that draft, which ingests the package and starts
#   certification. Never press "Submit for certification" in Partner Center
#   for a draft staged here: it submits the old content.
# get_draft prints the submission status first, so it also tracks
# certification (Certification -> Release -> Publishing -> in the Store).

name: Partner Center submit (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag (e.g. v2.6.0)"
        required: true
        type: string
      mode:
        description: "configure = check credentials; update_draft = stage MSIX + listing; update_metadata = stage listing only; get_draft = status + staged draft (tag unused); submit = commit the draft staged for this tag (starts certification)"
        type: choice
        options:
          - configure
          - update_draft
          - update_metadata
          - get_draft
          - submit
        default: configure

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      PRODUCT_ID: ${{ secrets.PARTNER_CENTER_PRODUCT_ID }}
    steps:
      - name: Checkout
        if: ${{ inputs.mode == 'update_draft' || inputs.mode == 'update_metadata' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        if: ${{ inputs.mode == 'update_draft' || inputs.mode == 'update_metadata' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        if: ${{ inputs.mode == 'update_draft' || inputs.mode == 'update_metadata' }}
        run: python -m pip install "PyYAML>=6.0"

      - name: Build Partner Center payloads
        if: ${{ inputs.mode == 'update_draft' || inputs.mode == 'update_metadata' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python scripts/build_partner_center_payloads.py \
            --tag "$TAG" \
            --repository "${{ github.repository }}" \
            --out-dir store/payloads

      - name: Upload payload artifacts
        if: ${{ inputs.mode == 'update_draft' || inputs.mode == 'update_metadata' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partner-center-payloads
          path: store/payloads/
          if-no-files-found: error

      - name: Download release MSIX
        if: ${{ inputs.mode == 'update_draft' || inputs.mode == 'update_metadata' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/stemma.msix"
          curl -fsSL -o stemma.msix "$url"
          ls -lh stemma.msix

      - name: Set up Linux credential storage
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          echo "anypass_just_to_unlock" | gnome-keyring-daemon --unlock
          eval "$(echo "anypass_just_to_unlock" | gnome-keyring-daemon --start --components=secrets)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@52af111539fa0c9569714bfca7c79e33bc704f92 # v1

      - name: Configure Store credentials
        run: |
          set -euo pipefail
          msstore reconfigure \
            --tenantId "${{ secrets.PARTNER_CENTER_TENANT_ID }}" \
            --sellerId "${{ secrets.PARTNER_CENTER_SELLER_ID }}" \
            --clientId "${{ secrets.PARTNER_CENTER_CLIENT_ID }}" \
            --clientSecret "${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}"

      - name: Verify Store credentials
        if: ${{ inputs.mode == 'configure' }}
        run: msstore info

      - name: Ensure pending Partner Center draft
        if: ${{ inputs.mode == 'update_metadata' }}
        id: ensure_draft
        run: |
          set -euo pipefail
          if NO_COLOR=1 msstore submission status "$PRODUCT_ID" --verbose 2>&1 | grep -q "Pending Submission"; then
            echo "Pending draft already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::No pending draft (for example after certification). Creating one from release MSIX."
          msstore publish stemma.msix \
            --appId "$PRODUCT_ID" \
            --noCommit \
            --verbose
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Update draft submission (MSIX package)
        if: ${{ inputs.mode == 'update_draft' }}
        run: |
          set -euo pipefail
          # Stage the package in the draft. A failed upload fails the run.
          # Nothing reaches certification until mode submit commits it.
          msstore publish stemma.msix \
            --appId "$PRODUCT_ID" \
            --noCommit \
            --verbose

      - name: Update draft listing metadata
        if: ${{ inputs.mode == 'update_draft' || inputs.mode == 'update_metadata' }}
        id: update_metadata
        run: |
          set -euo pipefail
          NO_COLOR=1 msstore submission status "$PRODUCT_ID" --verbose
          NO_COLOR=1 msstore submission get "$PRODUCT_ID" --verbose > submission.json
          python scripts/merge_partner_center_metadata.py \
            --submission submission.json \
            --listing store/listing.yaml \
            --tag "${{ inputs.tag }}" \
            --out submission-metadata.json
          metadata="$(cat submission-metadata.json)"
          msstore submission updateMetadata "$PRODUCT_ID" "$metadata" --verbose

      - name: Check listing metadata after update
        if: ${{ inputs.mode == 'update_draft' || inputs.mode == 'update_metadata' }}
        run: |
          set -euo pipefail
          version="${{ inputs.tag }}"
          version="${version#v}"
          NO_COLOR=1 msstore submission get "$PRODUCT_ID" --verbose > submission-after.json
          if python scripts/verify_partner_center_metadata.py \
            --submission submission-after.json \
            --expected submission-metadata.json \
            --tag "${{ inputs.tag }}"; then
            echo "Partner Center submission GET matches the updateMetadata payload."
          else
            echo "::warning::The submission GET may still show stale listing fields while the draft is PendingCommit."
            echo "::warning::Check the submission-metadata artifact before running mode submit."
            if grep -q "What's new in version ${version}" submission-metadata.json; then
              echo "Merged updateMetadata payload includes What's new for version ${version}."
            fi
          fi

      - name: Upload merged submission metadata
        # Also after a failed update, so there is something to inspect.
        if: ${{ !cancelled() && (inputs.mode == 'update_draft' || inputs.mode == 'update_metadata') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partner-center-submission-metadata
          path: submission-metadata.json
          if-no-files-found: warn

      - name: Summarize
        if: ${{ inputs.mode == 'update_draft' || inputs.mode == 'update_metadata' }}
        run: |
          set -euo pipefail
          if [ "${{ steps.ensure_draft.outputs.created }}" = "true" ]; then
            echo "Created a new draft from the release MSIX before updating the listing."
          fi
          {
            echo "Staged ${{ inputs.tag }} in the draft (PendingCommit)."
            echo
            echo "Partner Center's page shows the old content until the draft is"
            echo "committed. Check the JSON in the log and the submission-metadata"
            echo "artifact, then run this workflow with mode **submit** and the same tag."
            echo
            echo "**Do not press Submit for certification in Partner Center**: it"
            echo "submits the old content."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the draft (starts certification)
        if: ${{ inputs.mode == 'submit' }}
        run: |
          set -euo pipefail
          version="${{ inputs.tag }}"
          version="${version#v}"
          NO_COLOR=1 msstore submission status "$PRODUCT_ID" --verbose | tee status.txt
          # Commit only a draft that is still staged, and staged for this tag.
          if ! grep -q "PendingCommit" status.txt; then
            echo "::error::No draft waiting to be committed. Run update_draft first, or get_draft to see the status."
            exit 1
          fi
          NO_COLOR=1 msstore submission get "$PRODUCT_ID" --verbose > submission.json
          if ! grep -qF "in version ${version}" submission.json; then
            echo "::error::The pending draft's What's new is not for ${version}. Run update_draft with this tag first."
            exit 1
          fi
          msstore submission publish "$PRODUCT_ID" --verbose
          {
            echo "Committed ${{ inputs.tag }}. Within minutes the status becomes"
            echo "Certification; run mode get_draft to follow it."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Submission status and staged draft
        if: ${{ inputs.mode == 'get_draft' }}
        run: |
          set -euo pipefail
          # Status first: Certification -> Release -> Publishing -> in the
          # Store, with StatusDetails.Errors and CertificationReports.
          NO_COLOR=1 msstore submission status "$PRODUCT_ID" --verbose
          echo "---"
          NO_COLOR=1 msstore submission get "$PRODUCT_ID" --verbose
