# Optional: update / publish Partner Center drafts from a GitHub Release MSIX.
# Uses Microsoft Store CLI (msstore) for MSIX products. See docs/store-release-pipeline.md.

name: Partner Center submit (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag (e.g. v2.6.0)"
        required: true
        type: string
      mode:
        description: "configure = credentials; update_draft = MSIX + listing draft; get_draft = read submission; publish_draft = submit"
        type: choice
        options:
          - configure
          - update_draft
          - get_draft
          - publish_draft
        default: configure

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      PRODUCT_ID: ${{ secrets.PARTNER_CENTER_PRODUCT_ID }}
    steps:
      - name: Checkout
        if: ${{ inputs.mode == 'update_draft' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        if: ${{ inputs.mode == 'update_draft' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        if: ${{ inputs.mode == 'update_draft' }}
        run: python -m pip install "PyYAML>=6.0"

      - name: Build Partner Center payloads
        if: ${{ inputs.mode == 'update_draft' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python scripts/build_partner_center_payloads.py \
            --tag "$TAG" \
            --repository "${{ github.repository }}" \
            --out-dir store/payloads

      - name: Upload payload artifacts
        if: ${{ inputs.mode == 'update_draft' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partner-center-payloads
          path: store/payloads/
          if-no-files-found: error

      - name: Download release MSIX
        if: ${{ inputs.mode == 'update_draft' }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/releases/download/${TAG}/stemma.msix"
          curl -fsSL -o stemma.msix "$url"
          ls -lh stemma.msix

      - name: Set up Linux credential storage
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> "$GITHUB_ENV"
          echo "anypass_just_to_unlock" | gnome-keyring-daemon --unlock
          eval "$(echo "anypass_just_to_unlock" | gnome-keyring-daemon --start --components=secrets)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@52af111539fa0c9569714bfca7c79e33bc704f92 # v1

      - name: Configure Store credentials
        run: |
          set -euo pipefail
          msstore reconfigure \
            --tenantId "${{ secrets.PARTNER_CENTER_TENANT_ID }}" \
            --sellerId "${{ secrets.PARTNER_CENTER_SELLER_ID }}" \
            --clientId "${{ secrets.PARTNER_CENTER_CLIENT_ID }}" \
            --clientSecret "${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}"

      - name: Verify Store credentials
        if: ${{ inputs.mode == 'configure' }}
        run: msstore info

      - name: Update draft submission (MSIX package)
        if: ${{ inputs.mode == 'update_draft' }}
        id: publish_msix
        continue-on-error: true
        run: |
          set -euo pipefail
          # Commit the uploaded package into the Partner Center draft. This does
          # not submit for certification; use publish_draft for that step.
          msstore publish stemma.msix \
            --appId "$PRODUCT_ID" \
            --verbose

      - name: Update draft listing metadata
        if: ${{ inputs.mode == 'update_draft' }}
        id: update_metadata
        continue-on-error: true
        run: |
          set -euo pipefail
          metadata="$(cat store/payloads/metadata-update.json)"
          msstore submission updateMetadata "$PRODUCT_ID" "$metadata" --verbose

      - name: Summarize draft update
        if: ${{ inputs.mode == 'update_draft' }}
        run: |
          set -euo pipefail
          publish_ok="${{ steps.publish_msix.outcome == 'success' }}"
          metadata_ok="${{ steps.update_metadata.outcome == 'success' }}"
          if [ "$publish_ok" != "true" ]; then
            echo "::warning::MSIX upload via msstore publish failed."
            echo "::warning::Microsoft documents msstore updates for free products only."
            echo "::warning::Upload stemma.msix manually in Partner Center (Start update) if needed."
          fi
          if [ "$metadata_ok" != "true" ]; then
            echo "::warning::Listing metadata update failed (same free-products limitation may apply)."
            echo "::warning::Paste listing copy from docs/store-listing.md manually if needed."
          fi
          if [ "$publish_ok" != "true" ] && [ "$metadata_ok" != "true" ]; then
            echo "::error::Neither MSIX upload nor metadata update succeeded."
            exit 1
          fi
          echo "Partner Center draft update completed."

      - name: Get draft submission (debug)
        if: ${{ inputs.mode == 'get_draft' }}
        run: |
          set -euo pipefail
          msstore submission status "$PRODUCT_ID" --verbose
          echo "---"
          msstore submission get "$PRODUCT_ID" --verbose

      - name: Publish draft submission
        if: ${{ inputs.mode == 'publish_draft' }}
        run: msstore submission publish "$PRODUCT_ID" --verbose
