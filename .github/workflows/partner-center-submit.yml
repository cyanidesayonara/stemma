# Optional: update / publish Partner Center drafts from a GitHub Release MSIX.
# See docs/store-release-pipeline.md. Prefer update_draft; publish_draft is explicit.

name: Partner Center submit (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag (e.g. v2.6.0)"
        required: true
        type: string
      mode:
        description: "configure = credentials; update_draft = package draft; get_draft = read listing; publish_draft = submit"
        type: choice
        options:
          - configure
          - update_draft
          - get_draft
          - publish_draft
        default: configure

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ inputs.mode == 'update_draft' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Python
        if: ${{ inputs.mode == 'update_draft' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        if: ${{ inputs.mode == 'update_draft' }}
        run: python -m pip install "PyYAML>=6.0"

      - name: Build Partner Center payloads
        if: ${{ inputs.mode == 'update_draft' }}
        id: payloads
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python scripts/build_partner_center_payloads.py \
            --tag "$TAG" \
            --repository "${{ github.repository }}" \
            --out-dir store/payloads
          {
            echo "product_update<<EOF"
            cat store/payloads/product-update.json
            echo "EOF"
            echo "metadata_update<<EOF"
            cat store/payloads/metadata-update.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload payload artifacts
        if: ${{ inputs.mode == 'update_draft' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partner-center-payloads
          path: store/payloads/
          if-no-files-found: error

      - name: Configure Store credentials
        uses: microsoft/store-submission@1dbdf522fd5e751104cf3b325073b47f6f2fc09c # v1
        with:
          command: configure
          type: packaged
          seller-id: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          product-id: ${{ secrets.PARTNER_CENTER_PRODUCT_ID }}
          tenant-id: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          client-id: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          client-secret: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Update draft submission
        if: ${{ inputs.mode == 'update_draft' }}
        uses: microsoft/store-submission@1dbdf522fd5e751104cf3b325073b47f6f2fc09c # v1
        with:
          command: update
          type: packaged
          seller-id: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          product-id: ${{ secrets.PARTNER_CENTER_PRODUCT_ID }}
          tenant-id: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          client-id: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          client-secret: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          # Packages first; metadata PUT is a separate follow-up once package
          # update succeeds (Partner Center may reject listing module shape).
          product-update: ${{ steps.payloads.outputs.product_update }}

      - name: Get draft listing (debug)
        if: ${{ inputs.mode == 'get_draft' }}
        uses: microsoft/store-submission@1dbdf522fd5e751104cf3b325073b47f6f2fc09c # v1
        with:
          command: get
          type: packaged
          module-name: listing
          listing-language: en-us
          seller-id: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          product-id: ${{ secrets.PARTNER_CENTER_PRODUCT_ID }}
          tenant-id: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          client-id: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          client-secret: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}

      - name: Publish draft submission
        if: ${{ inputs.mode == 'publish_draft' }}
        uses: microsoft/store-submission@1dbdf522fd5e751104cf3b325073b47f6f2fc09c # v1
        with:
          command: publish
          type: packaged
          seller-id: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          product-id: ${{ secrets.PARTNER_CENTER_PRODUCT_ID }}
          tenant-id: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          client-id: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          client-secret: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
