name: Download stats

# Posts how often each release has been downloaded from GitHub to this
# run's summary (Actions > Download stats > the latest run). It only reads
# GitHub's public per-asset download counts: nothing about visitors or
# users is collected. Microsoft Store installs are in Partner Center.
#
# GitHub pauses scheduled workflows after 60 days without repository
# activity; run it by hand (Run workflow) to get the numbers regardless.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Count downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/release_stats.py >> "${GITHUB_STEP_SUMMARY}"
