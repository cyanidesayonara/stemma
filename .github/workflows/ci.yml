name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # pytest lives in requirements-dev.txt (runtime/dev split); the
        # test job needs both.
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run fast tests
        # The offscreen QPA platform keeps Qt away from the runner's
        # display driver entirely: real window show() on the hosted
        # Windows image intermittently access-violates or hangs inside
        # WM_PAINT once enough widget tests have run before it.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not slow and not hardware" -v --tb=short --timeout=120

  slow-model-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LOCALAPPDATA: ${{ github.workspace }}\.ci-localappdata
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Cache integrity-checked models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/models
            .ci-localappdata/stemma/models
          key: slow-models-${{ runner.os }}-${{ hashFiles('src/model_manager.py', 'src/mdx_separator.py') }}

      - name: Obtain required ONNX models
        run: python -m scripts.cache_slow_test_models

      - name: Report runtime diagnostics
        run: python main.py --diagnostics

      - name: Run real slow-model tests
        run: pytest -m "slow and not hardware" -v --tb=short --timeout=900
