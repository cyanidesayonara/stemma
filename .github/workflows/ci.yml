name: CI

# Kept light on GitHub: a pull request runs the fast tests once per push, a newer
# push stops the older run, and docs alone run nothing. A merge to main runs
# nothing again; a version tag, the Monday run and a run by hand do.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      # not the site or the store text: tests read those
      - "*.md"
      - "docs/**"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-release.txt
            requirements-dev.txt

      - name: Install dependencies
        # Install the hash-pinned release lock first so CI tests the exact
        # packages that ship, then layer dev-only tools on top.
        run: |
          python -m pip install --require-hashes -r requirements-release.txt
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run fast tests
        # The offscreen QPA platform keeps Qt away from the runner's
        # display driver entirely: real window show() on the hosted
        # Windows image intermittently access-violates or hangs inside
        # WM_PAINT once enough widget tests have run before it.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m "not slow and not hardware" -v --tb=short --timeout=120

  slow-model-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      LOCALAPPDATA: ${{ github.workspace }}\.ci-localappdata
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-release.txt
            requirements-dev.txt

      - name: Install dependencies
        # Install the hash-pinned release lock first so CI tests the exact
        # packages that ship, then layer dev-only tools on top.
        run: |
          python -m pip install --require-hashes -r requirements-release.txt
          python -m pip install -r requirements-dev.txt

      - name: Cache integrity-checked models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data/models
            .ci-localappdata/stemma/models
          key: slow-models-${{ runner.os }}-${{ hashFiles('src/model_manager.py', 'src/mdx_separator.py') }}

      - name: Obtain required ONNX models
        run: python -m scripts.cache_slow_test_models

      - name: Report runtime diagnostics
        run: python main.py --diagnostics

      - name: Run real slow-model tests
        run: pytest -m "slow and not hardware" -v --tb=short --timeout=900

  youtube-smoke-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    # issues: write lets the lock-age check open its stale-lock issue.
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-release.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-release.txt
          python -m pip install -r requirements-dev.txt

      - name: Fetch bundled JS runtime (QuickJS-ng)
        run: python scripts/fetch_js_runtime.py

      - name: Report runtime diagnostics
        run: python main.py --diagnostics

      - name: Run YouTube download smoke test
        run: python scripts/smoke_youtube_download.py

      # The two steps below only warn: they run even when the locked smoke
      # test failed, and never fail the job themselves (#260). See "Keeping
      # YouTube import working" in docs/DEVELOPMENT.md.
      - name: Check yt-dlp lock age
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_ytdlp_lock_age.py --open-issue

      # Last, because it replaces the locked yt-dlp in this job's Python.
      # Only yt-dlp and the yt-dlp-ejs it names change, as a lock refresh
      # would; the rest of the release lock stays. pwsh does not stop on a
      # failed native command, so each one checks $LASTEXITCODE.
      - name: Canary smoke test on the newest yt-dlp
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          function Stop-Canary($message) {
            echo "::warning title=yt-dlp canary::$message"
            exit 1
          }
          python -m pip install --upgrade --upgrade-strategy only-if-needed yt-dlp
          if ($LASTEXITCODE -ne 0) { Stop-Canary "Could not install the newest yt-dlp." }
          $ejs = python scripts/check_ytdlp_lock_age.py --print-expected-ejs
          if ($LASTEXITCODE -ne 0) { Stop-Canary "Could not read the yt-dlp-ejs version the newest yt-dlp expects." }
          python -m pip install "yt-dlp-ejs$ejs"
          if ($LASTEXITCODE -ne 0) { Stop-Canary "Could not install yt-dlp-ejs$ejs." }
          $version = python -c "import yt_dlp.version; print(yt_dlp.version.__version__)"
          python scripts/smoke_youtube_download.py
          if ($LASTEXITCODE -ne 0) { Stop-Canary "yt-dlp $version (yt-dlp-ejs$ejs) also fails the YouTube smoke test." }
          echo "::notice title=yt-dlp canary::yt-dlp $version (yt-dlp-ejs$ejs) passes the YouTube smoke test."
